<!doctype html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="utf-8">
  <title>Nirmal T R | PHP Application Developer | Full Stack Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Theme: apply the saved choice (or the OS preference on a first visit) before anything paints,
       so there is no flash of the wrong theme. The Angular app keeps it in sync afterwards. -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050816">
  <script>
    (function () {
      var light = false;
      try {
        var saved = localStorage.getItem('theme');
        light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
      } catch (e) { /* storage blocked: fall back to dark */ }
      var root = document.documentElement;
      root.classList.toggle('light-theme', light);
      root.classList.toggle('dark-theme', !light);
      root.style.backgroundColor = light ? '#f8fafc' : '#050816';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f8fafc' : '#050816');
    })();
  </script>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="canonical" href="https://nirmaltr.vercel.app/">

  <!-- ═══ Security Headers (via meta equivalents) ═══ -->
  <!-- Control referrer info sent on external links -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Performance: DNS prefetch for external resources -->

  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts (Inter only; the single source of the site font) with display=swap -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome: preloaded for fast icon rendering (navbar icons are critical) -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

<body class="dark-theme">
