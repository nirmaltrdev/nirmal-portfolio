<section class="hero-section" [class.color-shift]="enableColorShift">
  <!-- Particle & ThreeJS Layers -->
  <canvas #particleCanvas class="particle-canvas"></canvas>
  <div #threeContainer class="three-bg"></div>
  
  <div class="hero-content">
    <div class="hero-badge">
      <span class="status-dot pulsing"></span>
      Full Stack Software Engineer | Enterprise CRM & Architecture
    </div>

    <!-- Glitch Name -->
    <h1 class="hero-title hero-name" [class.glitching]="enableGlitch">
      {{ glitchText() }}
    </h1>

    <!-- Typewriter Role -->
    <h2 class="hero-subheading hero-role">
      {{ typedRole() }}<span class="blink-cursor">|</span>
    </h2>

    <p class="hero-subtitle hero-desc">
      Architecting modular enterprise CRM and business systems for the automobile service industry with Angular, Java Spring Boot, CodeIgniter 4, and scalable cloud architectures.
    </p>

    <div class="hero-actions">
      <button #ctaBtn class="btn btn-primary cta-btn magnetic" (click)="scrollTo('projects')">
        Explore Case Studies <i class="fas fa-arrow-right"></i>
      </button>
      <a href="assets/Nirmal_TR_Resume.pdf" download="Nirmal_TR_Resume.pdf" target="_blank" class="btn btn-outline cta-btn magnetic">
        <i class="fas fa-download"></i> Download Resume
      </a>
    </div>
  </div>

  <div class="scroll-hint"><span></span></div>
</section>
