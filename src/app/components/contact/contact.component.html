<section class="section contact-section" id="contact">
  <div class="container" #contactContainer>
    <div class="section-header">
      <h2 class="section-title text-center">Let's Connect</h2>
      <div class="title-underline"></div>
    </div>

    <div class="contact-grid">
      <div class="contact-info">
        <h3 class="info-title">Reach Out</h3>
        <p class="info-text">Whether you have a question, a project proposal, or just want to say hi, my inbox is always open.</p>
        
        <div class="info-items">
          <a href="mailto:nirmaltrejial@gmail.com" target="_blank" class="info-item" style="text-decoration: none; color: inherit;">
            <i class="fas fa-envelope"></i>
            <span>nirmaltrejial&#64;gmail.com</span>
          </a>
          <a href="https://linkedin.com/in/nirmaltr" target="_blank" class="info-item" style="text-decoration: none; color: inherit;">
            <i class="fab fa-linkedin"></i>
            <span>linkedin.com/in/nirmaltr</span>
          </a>
          <a href="https://github.com/nirmaltrdev" target="_blank" class="info-item" style="text-decoration: none; color: inherit;">
            <i class="fab fa-github"></i>
            <span>github.com/nirmaltrdev</span>
          </a>
        </div>
      </div>

      <div class="contact-form-wrapper glass-panel">
        <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submitForm()">
           <div class="form-group">
             <input type="text" class="form-control" formControlName="name" placeholder="Your Name" required>
           </div>
           <div class="form-group">
             <input type="email" class="form-control" formControlName="email" placeholder="Your Email" required>
           </div>
           <div class="form-group">
             <textarea class="form-control" rows="5" formControlName="message" placeholder="Your Message" required></textarea>
           </div>
           <button type="submit" class="btn btn-primary submit-btn magnetic" #submitBtn [disabled]="isSubmitting">
             {{ isSubmitting ? 'Sending...' : 'Send Message' }} <i class="fas fa-paper-plane"></i>
           </button>
        </form>
      </div>
    </div>
  </div>
</section>
