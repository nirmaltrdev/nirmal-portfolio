<section class="section experience-section" id="experience">
  <div class="container" #expContainer>
    <div class="section-header">
      <h2 class="section-title text-center">Career Journey</h2>
      <div class="title-underline"></div>
    </div>

    <div class="timeline-container">
      <div class="timeline-line"></div>
      
      @for (exp of experiences(); track exp.period; let i = $index) {
        <div class="timeline-item" [class.left]="i % 2 === 0" [class.right]="i % 2 !== 0" #timelineItem>
          <div class="timeline-dot pulsing-glow"></div>
          <div class="timeline-content glass-panel magnetic-hover">
            <span class="exp-period">{{ exp.period }}</span>
            <h3 class="exp-role">{{ exp.role }}</h3>
            <h4 class="exp-company">{{ exp.company }}</h4>
            <ul class="exp-desc" style="padding-left: 1.25rem; margin-bottom: 1rem; list-style-type: disc;">
              @for (point of exp.descriptionPoints; track point) {
                <li style="margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">{{ point }}</li>
              }
            </ul>
            <div class="tech-stack">
              @for (tech of exp.tech; track tech) {
                <span class="tech-pill">{{ tech }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
