<section class="section experience-section">
  <div class="container">
    <div class="section-header reveal">
      <h2 class="section-title">Experience</h2>
      <p class="section-subtitle text-muted">Professional journey.</p>
    </div>

    <div class="experience-layout">
      
      <!-- Sticky Index (Left) -->
      <div class="exp-index-wrapper">
        <div class="exp-sticky-index saas-card">
          <ul class="index-list">
            <li class="index-item" *ngFor="let exp of experiences; let i = index" [class.active]="activeIndex === i">
              <span class="index-indicator"></span>
              <span class="index-name">{{ exp.company.split(',')[0] }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Scrollable Details (Right) -->
      <div class="exp-details-wrapper">
        <div class="exp-detail-block reveal" *ngFor="let exp of experiences; let i = index">
          <div class="exp-header">
            <h3 class="exp-role">{{ exp.role }}</h3>
            <span class="exp-duration">{{ exp.duration }}</span>
          </div>
          <h4 class="exp-company text-gradient-primary">{{ exp.company }}</h4>
          
          <ul class="exp-desc-list">
            <li *ngFor="let desc of exp.description">
              <i class="fas fa-caret-right text-primary list-bullet"></i>
              <span>{{ desc }}</span>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</section>
