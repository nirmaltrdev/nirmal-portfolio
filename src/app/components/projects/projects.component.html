<section class="section projects-section" id="projects">
  <div class="container" #projectsContainer>
    <div class="section-header">
      <h2 class="section-title text-center">Featured Work</h2>
      <div class="title-underline"></div>
    </div>

    <div class="projects-grid">
      @for (project of projects(); track project.title; let i = $index) {
        <div class="project-card" #projectCard>
          <div class="project-image-wrapper">
            <div class="project-image-placeholder" style="display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(59, 130, 246, 0.05);">
              <i [class]="'fas fa-' + (project.icon === 'message' ? 'comments' : project.icon === 'user-switch' ? 'user-cog' : project.icon)" style="font-size: 3.5rem; color: var(--secondary); margin-bottom: 0.5rem; filter: drop-shadow(0 0 10px var(--secondary-glow));"></i>
              <span class="placeholder-text" style="font-size: 0.9rem; color: var(--text-muted);">{{ project.title }}</span>
            </div>
          </div>
          <div class="project-content">
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-desc">{{ project.description }}</p>
            <div class="project-tags">
              @for (tech of project.technologies; track tech) {
                <span class="project-tag">{{ tech }}</span>
              }
            </div>
            <div class="confidential-badge" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05); color: #ef4444; font-weight: 600; font-size: 0.85rem; user-select: none; width: fit-content;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              Confidential (Proprietary Code)
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
