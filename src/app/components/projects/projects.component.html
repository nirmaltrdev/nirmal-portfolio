<section class="section projects-section">
  <div class="container">
    <div class="section-header reveal">
      <h2 class="section-title">Featured Work</h2>
      <p class="section-subtitle text-muted">Architectural systems & automation platforms.</p>
    </div>

    <div class="projects-list">
      
      <div class="project-block reveal" *ngFor="let project of projects; let i = index" [ngClass]="{'reverse': i % 2 !== 0}">
        
        <!-- Abstract Visual Representation -->
        <div class="project-visual saas-card">
          <div class="visual-overlay"></div>
          <i class="fas fa-{{ project.icon }} visual-icon"></i>
          
          <!-- Generic Architecture Flow -->
          <div class="arch-flow-container">
            <div class="arch-node-small">
              <i class="fas fa-layer-group" style="color: var(--primary);"></i>
              <span>Frontend Interface</span>
            </div>
            
            <div class="arch-connector-small">
              <i class="fas fa-arrow-down pulsing-arrow"></i>
            </div>
            
            <div class="arch-node-small highlight">
              <i class="fas fa-server" style="color: var(--secondary);"></i>
              <span>Microservices / API</span>
            </div>
            
            <div class="arch-connector-small">
              <i class="fas fa-arrow-down pulsing-arrow"></i>
            </div>
            
            <div class="arch-node-small">
              <i class="fas fa-database" style="color: var(--success);"></i>
              <span>Data Layer & Storage</span>
            </div>
          </div>
        </div>

        <!-- Project Details -->
        <div class="project-details">
          <div class="project-label">Project {{ i + 1 | number:'2.0' }}</div>
          <h3 class="project-title">{{ project.title }}</h3>
          
          <div class="project-desc saas-card">
            <p>{{ project.description }}</p>
          </div>

          <div class="project-tech">
            <span class="tech-pill" *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>

          <div class="project-actions">
            <a *ngIf="project.demo" [href]="project.demo" target="_blank" class="btn btn-primary">
              <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
          </div>
        </div>

      </div>

    </div>
  </div>
</section>
