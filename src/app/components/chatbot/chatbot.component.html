<div class="saas-chat-widget" [class.chat-open]="isOpen()">
  <button class="chat-toggle-btn" type="button" (click)="toggleChat()" [attr.aria-expanded]="isOpen()" [attr.aria-label]="isOpen() ? 'Close chat' : 'Open chat'">
    <i class="fas fa-comment-dots" *ngIf="!isOpen()" aria-hidden="true"></i>
    <i class="fas fa-times" *ngIf="isOpen()" aria-hidden="true"></i>
  </button>

  <div class="chat-window saas-card" *ngIf="isOpen()" role="dialog" aria-labelledby="chat-title">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="status-dot" aria-hidden="true"></div>
        <div>
          <h4 class="chat-title" id="chat-title">Nirmal's AI Assistant</h4>
          <span class="chat-status">Typically replies instantly</span>
        </div>
      </div>
      <button class="close-btn" type="button" (click)="toggleChat()" aria-label="Close chat"><i class="fas fa-times"></i></button>
    </div>

    <!-- The only scrollable area in the panel -->
    <div class="chat-body" id="custom-chat-body" data-lenis-prevent aria-live="polite" aria-relevant="additions">
      <div class="chat-message-row" *ngFor="let msg of chatMessages" [ngClass]="msg.sender">
        <div class="chat-bubble">
          <!-- Bot replies: escaped, then basic Markdown (lists, bold, code). User text: plain interpolation. -->
          <div *ngIf="msg.sender === 'bot'; else userText" class="chat-text chat-text--md" [innerHTML]="msg.text | chatMarkdown"></div>
          <ng-template #userText><div class="chat-text">{{ msg.text }}</div></ng-template>
          <span class="chat-time">{{ msg.time }}</span>
        </div>
      </div>

      <!-- Suggested question chips: sit under the latest message (the greeting on first open) -->
      <div class="preset-chips" *ngIf="!presetsCollapsed && !isTyping">
        <button *ngFor="let preset of visiblePresets"
                type="button"
                class="preset-chip"
                (click)="handlePresetClick(preset.key)"
                [disabled]="isTyping">
          <i [class]="preset.icon + ' preset-icon'" aria-hidden="true"></i>
          <span>{{ preset.label }}</span>
        </button>
      </div>

      <div class="chat-message-row bot" *ngIf="isTyping">
        <div class="chat-bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <div class="chat-input-wrapper">
        <input type="text" [(ngModel)]="chatInputText" (keyup.enter)="sendChatMessage()"
               placeholder="Ask me anything..." aria-label="Ask me anything..." [disabled]="isTyping" maxlength="500">
        <button class="chat-send-btn" type="button" (click)="sendChatMessage()" [disabled]="!chatInputText.trim() || isTyping" aria-label="Send message">
          <i class="fas fa-paper-plane" aria-hidden="true"></i>
        </button>
      </div>
      <div class="chat-footer-meta">
        <button type="button" class="presets-toggle" (click)="togglePresets()" [attr.aria-expanded]="!presetsCollapsed">
          <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>
          <span>Suggested questions</span>
          <i class="fas" [class.fa-chevron-up]="presetsCollapsed" [class.fa-chevron-down]="!presetsCollapsed" aria-hidden="true"></i>
        </button>
        <span class="chat-watermark">Powered by Gemini AI</span>
      </div>
    </div>
  </div>
</div>
