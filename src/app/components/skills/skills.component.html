<section class="section skills-section" id="skills">
  <div class="container" #skillsContainer>
    <div class="section-header">
      <h2 class="section-title text-center">Technical Mastery</h2>
      <p class="section-subtitle text-center">Weapons of choice for crafting digital experiences.</p>
    </div>

    <div class="skills-grid">
      @for (group of skillGroups(); track group.category) {
        <div class="skill-card" #skillCard (mouseenter)="triggerConfetti($event)" style="align-items: flex-start;">
          <div class="skill-icon-wrapper" style="color: var(--secondary);">
            <i [class]="getCategoryIcon(group.icon)"></i>
          </div>
          <div class="skill-info">
            <div class="skill-header" style="margin-bottom: 0.75rem;">
              <span class="skill-name" style="font-size: 1.25rem; font-weight: 700; color: #fff;">{{ group.category }}</span>
            </div>
            <div class="skill-tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
              @for (s of group.skills; track s) {
                <span class="skill-tag" style="background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.2); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500;">
                  {{ s }}
                </span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
