<section class="section education-section">
  <div class="container">
    
    <div class="edu-grid">
      
      <!-- Education & Publications -->
      <div class="edu-col">
        <h3 class="col-title reveal">Credentials</h3>
        
        <div class="edu-list">
          <div class="edu-item reveal saas-card" *ngFor="let ed of education">
            <div class="item-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="item-content">
              <h4>{{ ed.degree }}</h4>
              <p>{{ ed.institution }}</p>
              <span class="item-meta">{{ ed.year }}</span>
            </div>
          </div>
        </div>

        <h3 class="col-title reveal mt-4" *ngIf="publications && publications.length > 0">Research</h3>
        
        <div class="edu-list">
          <div class="edu-item reveal saas-card" *ngFor="let pub of publications">
            <div class="item-icon"><i class="fas fa-book"></i></div>
            <div class="item-content">
              <h4>{{ pub.title }}</h4>
              <p>{{ pub.authors }}</p>
              <div class="pub-links">
                <span class="item-meta">{{ pub.date }}</span>
                <a [href]="pub.url" target="_blank" class="doi-link"><i class="fas fa-external-link-alt"></i> Read Publication</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Certifications -->
      <div class="edu-col">
        <h3 class="col-title reveal" style="animation-delay: 0.1s;">Certifications</h3>
        
        <div class="cert-list">
          <div class="cert-item reveal saas-card" *ngFor="let cert of certifications; let i = index" [style.animation-delay]="(i * 0.1) + 's'">
            <div class="cert-icon"><i class="fas fa-award"></i></div>
            <div class="cert-content">
              <h4>{{ cert.name }}</h4>
              <span class="cert-issuer">{{ cert.issuer }}</span>
            </div>
            <i class="fas fa-check-circle cert-check"></i>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>
