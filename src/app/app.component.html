<!-- app.component.html (SaaS Structural Shell) -->

<div class="saas-shell" [class.scrolled]="scrolled">
  <!-- Custom Cursor (Desktop) -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-outline" id="cursor-outline"></div>

  <!-- Sticky Blurred Navbar -->
  <header class="saas-nav" [class.glass-nav]="scrolled">
    <div class="container nav-inner">
      <a class="nav-brand" (click)="scrollTo('hero')">
        <span class="brand-text text-gradient-primary">Nirmal T R</span>
      </a>
      
      <nav class="nav-links">
        <a class="nav-link" [class.active]="activeSection === 'about'" (click)="scrollTo('about')">About</a>
        <a class="nav-link" [class.active]="activeSection === 'skills'" (click)="scrollTo('skills')">Skills</a>
        <a class="nav-link" [class.active]="activeSection === 'projects'" (click)="scrollTo('projects')">Work</a>
        <a class="nav-link" [class.active]="activeSection === 'experience'" (click)="scrollTo('experience')">Experience</a>
        <a class="nav-link" [class.active]="activeSection === 'contact'" (click)="scrollTo('contact')">Contact</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
          <i class="fa-solid" [class.fa-moon]="isLightTheme" [class.fa-sun]="!isLightTheme"></i>
        </button>
        <button class="btn btn-primary desktop-btn" (click)="scrollTo('contact')">Let's Talk <i class="fas fa-paper-plane" style="margin-left: 0.25rem;"></i></button>
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Menu">
          <i class="fas" [class.fa-bars]="!isMobileMenuOpen" [class.fa-times]="isMobileMenuOpen"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" [class.open]="isMobileMenuOpen">
    <nav class="mobile-nav-links">
      <a class="nav-link" [class.active]="activeSection === 'about'" (click)="scrollTo('about')">About</a>
      <a class="nav-link" [class.active]="activeSection === 'skills'" (click)="scrollTo('skills')">Skills</a>
      <a class="nav-link" [class.active]="activeSection === 'projects'" (click)="scrollTo('projects')">Work</a>
      <a class="nav-link" [class.active]="activeSection === 'experience'" (click)="scrollTo('experience')">Experience</a>
      <a class="nav-link" [class.active]="activeSection === 'contact'" (click)="scrollTo('contact')">Contact</a>
      <button class="btn btn-primary" style="margin-top: 1.5rem;" (click)="scrollTo('contact')">Let's Talk <i class="fas fa-paper-plane" style="margin-left: 0.25rem;"></i></button>
    </nav>
  </div>

  <main class="saas-main-content">
    
    <!-- Hero Component -->
    <app-hero id="hero"></app-hero>

    <!-- About Section (Enterprise Architecture) -->
    <app-about id="about"></app-about>

    <!-- Services Section -->
    <app-services id="services"></app-services>

    <!-- Skills Section (Terminal Tabs) -->
    <app-skills id="skills"></app-skills>

    <!-- Projects Section -->
    <app-projects id="projects"></app-projects>

    <!-- Experience Section (Sticky Scroll) -->
    <app-experience id="experience"></app-experience>

    <!-- Education Section -->
    <app-education id="education"></app-education>

    <!-- Contact Section -->
    <app-contact id="contact"></app-contact>

  </main>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- SaaS Chat Widget (Floating Standalone Component) -->
  <app-chatbot></app-chatbot>

</div>
