<!-- app.component.html (SaaS Structural Shell) -->

<div class="saas-shell" [class.scrolled]="scrolled">
  <!-- Custom Cursor (Desktop) -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-outline" id="cursor-outline"></div>

  <!-- Sticky Blurred Navbar -->
  <header class="saas-nav" [class.glass-nav]="scrolled">
    <div class="container nav-inner">
      <a class="nav-brand" href="#hero" (click)="scrollTo('hero', $event)">
        <span class="brand-text text-gradient-primary">Nirmal T R</span>
      </a>
      
      <nav class="nav-links">
        <a class="nav-link" [class.active]="activeSection === 'about'" href="#about" (click)="scrollTo('about', $event)">About</a>
        <a class="nav-link" [class.active]="activeSection === 'skills'" href="#skills" (click)="scrollTo('skills', $event)">Skills</a>
        <a class="nav-link" [class.active]="activeSection === 'projects'" href="#projects" (click)="scrollTo('projects', $event)">Work</a>
        <a class="nav-link" [class.active]="activeSection === 'experience'" href="#experience" (click)="scrollTo('experience', $event)">Experience</a>
        <a class="nav-link" [class.active]="activeSection === 'contact'" href="#contact" (click)="scrollTo('contact', $event)">Contact</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" (click)="toggleTheme()" type="button"
                [attr.aria-label]="isLightTheme ? 'Switch to dark theme' : 'Switch to light theme'"
                [attr.aria-pressed]="isLightTheme">
          <i class="fa-solid" [class.fa-moon]="isLightTheme" [class.fa-sun]="!isLightTheme" aria-hidden="true"></i>
        </button>
        <button class="btn btn-primary desktop-btn" type="button" (click)="scrollTo('contact')">Let's Talk <i class="fas fa-paper-plane btn-icon-gap" aria-hidden="true"></i></button>
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Menu" type="button" [attr.aria-expanded]="isMobileMenuOpen" aria-controls="mobile-menu">
          <i class="fas" [class.fa-bars]="!isMobileMenuOpen" [class.fa-times]="isMobileMenuOpen" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" id="mobile-menu" [class.open]="isMobileMenuOpen" [attr.aria-hidden]="!isMobileMenuOpen" [attr.inert]="isMobileMenuOpen ? null : ''">
    <nav class="mobile-nav-links">
      <a class="nav-link" [class.active]="activeSection === 'about'" href="#about" (click)="scrollTo('about', $event)">About</a>
      <a class="nav-link" [class.active]="activeSection === 'skills'" href="#skills" (click)="scrollTo('skills', $event)">Skills</a>
      <a class="nav-link" [class.active]="activeSection === 'projects'" href="#projects" (click)="scrollTo('projects', $event)">Work</a>
      <a class="nav-link" [class.active]="activeSection === 'experience'" href="#experience" (click)="scrollTo('experience', $event)">Experience</a>
      <a class="nav-link" [class.active]="activeSection === 'contact'" href="#contact" (click)="scrollTo('contact', $event)">Contact</a>
      <button class="btn btn-primary mobile-menu-cta" type="button" (click)="scrollTo('contact')">Let's Talk <i class="fas fa-paper-plane btn-icon-gap" aria-hidden="true"></i></button>
    </nav>
  </div>

  <main class="saas-main-content">
    
    <!-- Hero Component -->
    <app-hero id="hero"></app-hero>

    <!-- About Section (Enterprise Architecture) -->
    <app-about id="about"></app-about>

    <!-- Services Section -->
    <app-services id="services"></app-services>

    <!-- Skills Section (Terminal Tabs) -->
    <app-skills id="skills"></app-skills>

    <!-- Projects Section -->
    <app-projects id="projects"></app-projects>

    <!-- Experience Section (Sticky Scroll) -->
    <app-experience id="experience"></app-experience>

    <!-- Education Section -->
    <app-education id="education"></app-education>

    <!-- Contact Section -->
    <app-contact id="contact"></app-contact>

  </main>

  <!-- Footer -->
  <app-footer></app-footer>

  <!-- SaaS Chat Widget (Floating Standalone Component) -->
  <app-chatbot></app-chatbot>

</div>
