name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Gemini API key into config.json
        run: |
          echo '{"geminiApiKey":"${{ secrets.GEMINI_API_KEY }}"}' > src/assets/config.json

      - name: Build Angular app (production)
        run: npx ng build --configuration production --base-href /nirmal-portfolio/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/portfolio-web
          publish_branch: gh-pages
